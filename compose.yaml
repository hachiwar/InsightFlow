name: insightflow

services:
  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  dataagent:
    build:
      context: ./dataagent
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      DATAAGENT_HOST: 0.0.0.0
      DATAAGENT_PORT: 8090
      DATAAGENT_API_KEY: ${DATAAGENT_API_KEY:?Set DATAAGENT_API_KEY in .env}
      DATAAGENT_ALLOW_MOCK: ${DATAAGENT_ALLOW_MOCK:-false}
      DATAAGENT_INITIALIZE_DEMO: ${DATAAGENT_INITIALIZE_DEMO:-false}
      DATAAGENT_DATABASE_NAME: ${DATAAGENT_DATABASE_NAME:-trade_db}
      DATAAGENT_DB_PATH: ${DATAAGENT_DB_PATH:-/app/runtime_data/trade_demo.db}
      DATAAGENT_BUSINESS_META_PATH: ${DATAAGENT_BUSINESS_META_PATH:-}
      DATAAGENT_ALLOWED_TABLES: ${DATAAGENT_ALLOWED_TABLES:?Set DATAAGENT_ALLOWED_TABLES in .env}
      DATAAGENT_MAX_REQUEST_BYTES: ${DATAAGENT_MAX_REQUEST_BYTES:-65536}
      DATAAGENT_MILVUS_URI: ${DATAAGENT_MILVUS_URI:-/app/runtime_data/schema_index.db}
      DATAAGENT_MILVUS_TOKEN: ${DATAAGENT_MILVUS_TOKEN:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
      DASHSCOPE_CHAT_URL: ${DASHSCOPE_CHAT_URL:-}
      DASHSCOPE_EMBEDDING_URL: ${DASHSCOPE_EMBEDDING_URL:-}
      DASHSCOPE_RERANK_URL: ${DASHSCOPE_RERANK_URL:-}
    volumes:
      - dataagent-data:/app/runtime_data
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  mindagent:
    build:
      context: ./mindagent
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-mindagent-local-placeholder}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-mindagent-local-placeholder}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      DATAAGENT_BASE_URL: http://dataagent:8090
      DATAAGENT_TIMEOUT_MS: ${DATAAGENT_TIMEOUT_MS:-30000}
      DATAAGENT_API_KEY: ${DATAAGENT_API_KEY:?Set DATAAGENT_API_KEY in .env}
      MINDAGENT_AUTH_ENABLED: "true"
      MINDAGENT_API_KEY: ${MINDAGENT_API_KEY:?Set MINDAGENT_API_KEY in .env}
      MINDAGENT_ADMIN_API_KEY: ${MINDAGENT_ADMIN_API_KEY:?Set MINDAGENT_ADMIN_API_KEY in .env}
      MINDAGENT_PRINCIPAL_ID: ${MINDAGENT_PRINCIPAL_ID:-api-client}
      MINDAGENT_DATA_DIR: /app/data/java
      KNOWLEDGE_STORE_PATH: /app/data/java/knowledge-store.json
      MEMORY_STORE_PATH: /app/data/java/memory-store.json
      EVAL_BASELINE_PATH: /app/data/java/eval-baseline.json
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    volumes:
      - mindagent-data:/app/data
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      dataagent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      mindagent:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:
  dataagent-data:
  mindagent-data:
  caddy-data:
  caddy-config:
